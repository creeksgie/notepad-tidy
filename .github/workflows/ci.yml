name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le workflow ne fait que compiler et tester : il n'a besoin que de lire.
# Sur un dépôt public, le jeton d'une PR venue d'un fork ne doit rien pouvoir
# écrire.
permissions:
  contents: read

jobs:
  build:
    # Le projet cible Windows, mais Core n'a aucune dépendance système :
    # il compile et se teste partout. Seul le CLI touche à des chemins Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
